[package]
name = "boop"
version = "0.0.0"
edition = "2021"
description = "Control iOS simulators and Android devices from the command line: element tree, tap, swipe, type, screenshot"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
